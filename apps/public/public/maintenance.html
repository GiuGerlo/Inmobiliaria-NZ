<!DOCTYPE html>
<!--
  Página de mantenimiento del sitio público de ventas.
  Se sirve (HTTP 503) cuando el modo mantenimiento está activo: el admin escribe un bloque en el
  .htaccess del público (ADR-0010) que enruta a esta página a todos, menos la IP permitida.
  Toggle desde el admin; ver docs/runbooks/modo-mantenimiento.md.
-->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>En mantenimiento — Nadina Zaranich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:  #05172d;
            --gold:  #c5a572;
            --white: #f9fafb;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--navy);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            color: var(--white);
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        /* Dot grid */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(197,165,114,0.06) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* Radial glow at top */
        body::after {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 360px;
            background: radial-gradient(ellipse at top, rgba(197,165,114,0.07) 0%, transparent 65%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            text-align: center;
            max-width: 440px;
        }

        /* Logo */
        .logo { height: 48px; width: auto; opacity: 0.92; }

        /* Icon wrap */
        .icon-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(197,165,114,0.2);
            animation: ring-pulse 3s ease-in-out infinite;
        }

        .ring-inner {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 1px solid rgba(197,165,114,0.1);
        }

        .icon-bg {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(197,165,114,0.08);
        }

        .icon-svg { color: var(--gold); }

        @keyframes ring-pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.07); opacity: 0.15; }
        }

        /* Label */
        .label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(197,165,114,0.5);
        }

        /* Text */
        .text-block { display: flex; flex-direction: column; gap: 10px; }

        h1 {
            font-size: clamp(22px, 4.5vw, 28px);
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
            color: rgba(255,255,255,0.90);
        }

        .subtitle {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            color: rgba(255,255,255,0.35);
        }

        /* Gold divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .divider-line { height: 1px; width: 32px; background: rgba(197,165,114,0.2); }
        .divider-dot  { width: 4px; height: 4px; border-radius: 50%; background: rgba(197,165,114,0.3); }
    </style>
</head>
<body>
    <div class="content">
        <img class="logo" src="/img/logo.png" alt="Nadina Zaranich — Estudio Jurídico Inmobiliario">

        <div class="icon-wrap">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="icon-bg">
                <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
        </div>

        <p class="label">Sitio web</p>

        <div class="text-block">
            <h1>Volvemos enseguida</h1>
            <p class="subtitle">
                Estamos realizando mejoras en el sitio.<br>
                Gracias por tu paciencia.
            </p>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
        </div>
    </div>
</body>
</html>
